[package]
name = "qr-file-transfer"
version = "0.1.0"
edition = "2024"
description = "Packetization and reassembly for animated QR file transfers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.21"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
